title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Suggest an improvement for Kyrelix.
        Please search existing ideas first.
        English and Russian are welcome.

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Examples, alternatives, or screenshots.
